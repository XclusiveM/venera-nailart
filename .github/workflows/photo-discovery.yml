name: Audit public photo sources
on:
  push:
    branches:
      - audit/booking-fixes-2026-10-20
    paths:
      - 'tools/photo_discovery.py'
      - '.github/workflows/photo-discovery.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public photo candidates
        run: python tools/photo_discovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-source-audit
          path: artifacts/photo-source-audit/
          if-no-files-found: warn
