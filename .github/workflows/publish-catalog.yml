name: Обновление прайса на сайте
on:
  push:
    branches: [main]
    paths:
      - 'data/services.json'
      - 'scripts/sync_catalog.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: venera-catalog-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Получить сайт
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить каталог и синхронизировать HTML
        run: python3 scripts/sync_catalog.py --write
      - name: Проверить синтаксис JavaScript
        run: node --check assets/site.js
      - name: Сохранить изменения страниц
        run: |
          if ! git diff --quiet -- '*.html'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html'
            git commit -m "chore(catalog): publish synchronized prices and services [skip ci]"
            git push
          else
            echo "Страницы уже синхронизированы"
          fi
