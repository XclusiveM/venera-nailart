name: Audit public salon reviews
on:
  push:
    branches:
      - audit/booking-fixes-2026-10-20
    paths:
      - 'tools/review_discovery.py'
      - '.github/workflows/review-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public browser tools
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Review public review pages
        run: python tools/review_discovery.py
      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salon-reviews-internal-audit
          path: artifacts/reviews-audit/
          if-no-files-found: warn
          retention-days: 1
