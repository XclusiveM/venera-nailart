name: Site checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks and build freshness
        run: python tests/check_site.py
      - name: Catalog price mutation regression
        run: |
          python3 tests/price_mutation.py
          python3 tests/catalog_copy.py
      - name: JS syntax
        run: |
          node --check assets/site.js
          node --check assets/booking-pricing.js
          node tests/booking_pricing.cjs
      - name: Browser smoke test (Chromium + WebKit)
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium webkit
          python tests/smoke.py
      - name: Upload UI preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn

      - name: Show first ten overflow CSV rows
        if: always()
        run: |
          if test -f artifacts/overflow-results.csv; then head -n 10 artifacts/overflow-results.csv; else echo 'overflow CSV missing'; fi
      - name: Upload responsive overflow matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-overflow-results
          path: artifacts/overflow-results.csv
          if-no-files-found: warn
