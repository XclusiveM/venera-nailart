<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Редактор каталога — Венера NAILART</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#242124;background:#f7f4f1}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px 16px 80px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(24px,5vw,36px);margin:16px 0 4px}p{line-height:1.5}.note{background:#fff2d9;border:1px solid #e4c889;padding:14px;border-radius:14px;margin:18px 0}.bar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}button,.file{border:1px solid #cbbeb6;background:#fff;color:#282025;border-radius:11px;padding:12px 15px;font:inherit;cursor:pointer}button.primary{background:#30232c;color:#fff;border-color:#30232c}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;border:1px solid #d0c6bf;border-radius:9px;padding:11px;background:#fff;font:inherit;color:#222}label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}.list{display:grid;gap:12px}.card{background:white;border:1px solid #e6ddd8;border-radius:16px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.status{font-size:12px;color:#685b61}.error{color:#a51f28}.success{color:#11683d}.muted{color:#675d63}summary{cursor:pointer;font-weight:600}.empty{padding:22px;text-align:center}@media(max-width:550px){.grid{grid-template-columns:1fr}.wrap{padding:14px 12px 60px}.card{padding:13px}} </style></head>
<body><main class="wrap"><header><div><h1>Услуги и цены</h1><div class="muted">Венера NAILART · редактор черновика</div></div><span class="status" id="state">Загрузка…</span></header>
<div class="note"><strong>Режим подготовки.</strong> Этот редактор не публикует изменения на сайте и не является защищённой админ-панелью. Черновик хранится только в этом браузере. Для переноса изменений скачайте JSON. Не вводите пароли или персональные данные клиентов.</div>
<div class="bar"><button id="add" class="primary">+ Добавить услугу</button><button id="download">Скачать JSON</button><button id="reset">Отменить изменения</button><label class="file">Загрузить JSON<input type="file" id="upload" accept=".json,application/json" hidden></label></div>
<div class="bar"><input id="search" placeholder="Поиск по названию услуги" aria-label="Поиск услуг"><select id="filter" aria-label="Фильтр по категории"><option value="">Все категории</option></select></div>
<p id="feedback" role="status" aria-live="polite"></p><div class="list" id="list"></div>
</main><script>
(function(){'use strict';
const KEY='venera-admin-draft-v1', list=document.getElementById('list'),feedback=document.getElementById('feedback'),state=document.getElementById('state');let data,original;
const el=(tag,attrs={},value)=>{const e=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>{if(k==='class')e.className=v;else e.setAttribute(k,v)});if(value!==undefined)e.textContent=value;return e};
const deep=x=>JSON.parse(JSON.stringify(x));
function validate(d){if(!d||d.schemaVersion!==1||!Array.isArray(d.services)||!Array.isArray(d.categories)||!Array.isArray(d.extras))throw Error('Неверный формат каталога');const ids=new Set();for(const s of d.services){if(!s.id||!/^[a-z0-9-]+$/.test(s.id)||ids.has(s.id))throw Error('Некорректный или повторяющийся ID: '+s.id);ids.add(s.id);if(typeof s.name!=='string'||!s.name.trim())throw Error('У услуги '+s.id+' отсутствует название');if(!d.categories.some(c=>c.id===s.cat))throw Error('Неизвестная категория: '+s.cat);if(s.price!==null&&(!Number.isInteger(s.price)||s.price<0))throw Error('Неверная цена: '+s.name);if(s.min!==null&&(!Number.isInteger(s.min)||s.min<1))throw Error('Неверная длительность: '+s.name);if(!['published','hidden','archived','draft'].includes(s.status))throw Error('Неверный статус: '+s.name)}return true}
function message(t,err=false){feedback.textContent=t;feedback.className=err?'error':'success'}
function save(){try{validate(data);localStorage.setItem(KEY,JSON.stringify(data));state.textContent='Черновик сохранён в браузере';message('Изменения сохранены локально. Сайт не изменён.')}catch(e){state.textContent='Есть ошибки';message(e.message,true)}}
function field(parent,label,value,onChange,kind='text'){const wrap=el('div');wrap.append(el('label',{},label));const inp=el('input',{type:kind,value:value==null?'':String(value)});inp.addEventListener('change',()=>onChange(inp.value));wrap.append(inp);parent.append(wrap)}
function draw(){list.replaceChildren();const term=document.getElementById('search').value.toLowerCase().trim(),cat=document.getElementById('filter').value;let found=0;for(const s of data.services){if(term&&!s.name.toLowerCase().includes(term)||cat&&s.cat!==cat)continue;found++;const card=el('article',{class:'card'}),head=el('div',{class:'head'}),name=el('strong',{},s.name),status=el('span',{class:'status'},s.status==='published'?'Опубликовано в каталоге':s.status==='hidden'?'Скрыто':s.status==='archived'?'Архив':'Черновик');head.append(name,status);card.append(head);const grid=el('div',{class:'grid'});
field(grid,'Название',s.name,v=>{s.name=v.trim();save();draw()});field(grid,'Цена в рублях (пусто — по запросу)',s.price,v=>{s.price=v.trim()===''?null:Number(v);save();draw()},'number');field(grid,'Длительность, минуты',s.min,v=>{s.min=v.trim()===''?null:Number(v);save();draw()},'number');field(grid,'Описание',s.note||'',v=>{s.note=v;save()});
const catbox=el('div');catbox.append(el('label',{},'Категория'));const sel=el('select');for(const c of data.categories){const opt=el('option',{value:c.id},c.title);opt.selected=c.id===s.cat;sel.append(opt)}sel.addEventListener('change',()=>{s.cat=sel.value;save();draw()});catbox.append(sel);grid.append(catbox);
const stbox=el('div');stbox.append(el('label',{},'Статус'));const st=el('select');[['published','Опубликовано'],['draft','Черновик'],['hidden','Скрыто'],['archived','Архив']].forEach(([v,t])=>{const o=el('option',{value:v},t);o.selected=s.status===v;st.append(o)});st.addEventListener('change',()=>{s.status=st.value;save();draw()});stbox.append(st);grid.append(stbox);card.append(grid);card.append(el('p',{class:'status'},'ID: '+s.id));list.append(card)}if(!found)list.append(el('div',{class:'empty'},'Услуги не найдены'))}
function setup(){const f=document.getElementById('filter');f.replaceChildren(el('option',{value:''},'Все категории'));for(const c of data.categories)f.append(el('option',{value:c.id},c.title));draw()}
document.getElementById('search').addEventListener('input',draw);document.getElementById('filter').addEventListener('change',draw);
document.getElementById('add').addEventListener('click',()=>{const id='new-'+Date.now().toString(36);data.services.unshift({id,cat:data.categories[0].id,name:'Новая услуга',price:null,min:null,note:'',status:'draft'});save();document.getElementById('search').value='';document.getElementById('filter').value='';draw();window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Удалить локальный черновик и вернуть исходные данные?'))return;localStorage.removeItem(KEY);data=deep(original);setup();message('Исходные данные восстановлены')});
document.getElementById('download').addEventListener('click',()=>{try{validate(data);const b=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}),u=URL.createObjectURL(b),a=el('a',{href:u,download:'services.json'});a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);message('JSON скачан. Он ещё не опубликован.')}catch(e){message(e.message,true)}});
document.getElementById('upload').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;if(file.size>1000000){message('Файл слишком большой',true);return}try{const d=JSON.parse(await file.text());validate(d);data=d;save();setup()}catch(err){message('Не удалось загрузить файл: '+err.message,true)}e.target.value=''});
fetch('../data/services.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{validate(d);original=deep(d);try{const draft=localStorage.getItem(KEY);data=draft?JSON.parse(draft):deep(d);validate(data)}catch(e){data=deep(d);message('Старый черновик повреждён. Загружен исходный каталог.',true)}state.textContent='Редактор готов';setup()}).catch(e=>{state.textContent='Ошибка загрузки';message('Каталог не загрузился: '+e.message,true)});
})();
</script></body></html>
